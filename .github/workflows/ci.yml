name: CI/CD Pipeline - Đà Lạt Cafe

on:
  push:
    branches:
      - master
      - 'feature/**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # 1. FRONTEND CI (Next.js 16 + React 19)
  # ==========================================
  frontend-ci:
    name: Frontend CI (Next.js & UI Tests)
    runs-on: ubuntu-latest
    env:
      # Test-only signing key: the UI suite signs session cookies with it (not a real secret).
      AUTH_JWT_SECRET: ci-only-ui-test-signing-key-not-a-secret-0123456789
    defaults:
      run:
        working-directory: frontend-nextjs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc --noEmit

      - name: Build Next.js Application
        run: npm run build

      - name: Run Automated UI/UX & Admin Action Test Suite (43 Tests)
        run: |
          # Khởi động production server Next.js ở chế độ background
          npx next start -p 3000 &
          
          # Đợi server sẵn sàng tiếp nhận request (tối đa 30s)
          echo "Waiting for Next.js server to start on port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null 2>&1; then
              echo "Next.js server is ready at http://localhost:3000!"
              break
            fi
            sleep 1
          done

          # Chạy bộ test UI/UX & API toàn diện
          npm test

  # ==========================================
  # 2. BACKEND CI (Java SE 17 Pure OOP + JUnit 5)
  # ==========================================
  backend-ci:
    name: Backend CI (Java SE 17 & JUnit 5)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Eclipse Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Compile & Run JUnit 5 Unit Tests
        run: mvn --batch-mode clean test

      - name: Archive JUnit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-reports
          path: backend-java/target/surefire-reports/
          if-no-files-found: ignore

  # ==========================================
  # 3. CI GATEWAY STATUS
  # ==========================================
  ci-status:
    name: CI Pipeline Status
    needs: [frontend-ci, backend-ci]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All CI Jobs Passed
        run: |
          if [ "${{ needs.frontend-ci.result }}" != "success" ] || [ "${{ needs.backend-ci.result }}" != "success" ]; then
            echo "CI Pipeline failed! Please review job outputs above."
            exit 1
          fi
          echo "All Frontend (Next.js) and Backend (Java SE 17) checks passed successfully!"

